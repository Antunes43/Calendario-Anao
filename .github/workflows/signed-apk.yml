name: APK assinado para atualizacao
on:
  workflow_dispatch:
jobs:
  signed-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restaurar chave privada de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.CALENDAR_KEYSTORE_BASE64 }}
          CALENDAR_KEYSTORE_PASSWORD: ${{ secrets.CALENDAR_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret CALENDAR_KEYSTORE_BASE64 ausente"; exit 1; }
          test -n "$CALENDAR_KEYSTORE_PASSWORD" || { echo "Secret CALENDAR_KEYSTORE_PASSWORD ausente"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/calendario-anao.jks"
          chmod 600 "$RUNNER_TEMP/calendario-anao.jks"
          echo "CALENDAR_KEYSTORE_PATH=$RUNNER_TEMP/calendario-anao.jks" >> "$GITHUB_ENV"
      - name: Compilar APK assinado
        env:
          CALENDAR_KEYSTORE_PASSWORD: ${{ secrets.CALENDAR_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verificar assinatura
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Disponibilizar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: Calendario-Anao-APK-Assinado
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
