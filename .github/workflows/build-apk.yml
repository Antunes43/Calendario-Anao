name: Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'feat/calendar-information-v04']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --info
      - name: Restaurar chave de assinatura (se configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.CALENDAR_KEYSTORE_BASE64 }}
          CALENDAR_KEYSTORE_PASSWORD: ${{ secrets.CALENDAR_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$CALENDAR_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/calendario-anao.jks"
            chmod 600 "$RUNNER_TEMP/calendario-anao.jks"
            echo "CALENDAR_KEYSTORE_PATH=$RUNNER_TEMP/calendario-anao.jks" >> "$GITHUB_ENV"
            echo "SIGNED_APK_ENABLED=true" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK de atualizacao assinado
        if: env.SIGNED_APK_ENABLED == 'true'
        env:
          CALENDAR_KEYSTORE_PASSWORD: ${{ secrets.CALENDAR_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verificar APK assinado
        if: env.SIGNED_APK_ENABLED == 'true'
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Disponibilizar APK assinado
        if: env.SIGNED_APK_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Calendario-Anao-APK-Assinado
          path: app/build/outputs/apk/release/app-release.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Calendario-Anao-APK
          path: app/build/outputs/apk/debug/app-debug.apk
